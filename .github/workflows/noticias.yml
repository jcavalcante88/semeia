name: Noticias do mundo gospel

# A cada 12 horas. Brasilia e UTC-3 o ano todo (o horario de verao acabou
# em 2019), entao 09:10 e 21:10 UTC caem em 06:10 e 18:10 daqui:
# as materias da madrugada estao no ar de manha, e as do dia, a noite.
#
# Nao ha risco em rodar mais vezes: a coluna `link` da tabela `noticias` e
# unique e o insert usa `on conflict`, entao materia repetida nao entra.
on:
  schedule:
    - cron: "10 9,21 * * *"
  workflow_dispatch: # botao manual para testar

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de coleta
        run: |
          codigo=$(curl -s -o /tmp/saida.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "${{ secrets.SITE_URL }}/api/cron/noticias" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/saida.json
          echo
          if [ "$codigo" != "200" ]; then
            echo "Falhou com HTTP $codigo"
            exit 1
          fi
